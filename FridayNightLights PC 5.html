<style>
:root{--bg:#050a12;--fg:#f5f8f2;--ac:#ffd400;--pn:rgba(6,12,22,.92);--line:#3a4e64;--card:#152233}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none}
canvas#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none}

#hud{display:none}
#sb{position:fixed;top:max(10px,env(safe-area-inset-top));left:16px;display:flex;align-items:stretch;background:linear-gradient(180deg,rgba(18,28,45,.95),rgba(8,14,24,.95));border:1px solid rgba(255,212,0,.25);border-radius:14px;overflow:hidden;z-index:5;font-weight:700;box-shadow:0 8px 28px rgba(0,0,0,.45),0 0 0 1px rgba(255,255,255,.06)}
#sb .tm{display:flex;align-items:center;gap:8px;padding:6px 12px;opacity:.65}#sb .tm.ball{opacity:1;background:rgba(255,212,0,.12);box-shadow:inset 0 -2px 0 var(--ac)}
#sb u{width:14px;height:14px;border-radius:50%;border:3px solid;display:inline-block}#sb .sab{font-size:14px;letter-spacing:1px}#sb b{font-size:22px;min-width:26px;text-align:right}
#sb .pips{font-size:7px;letter-spacing:2px;color:var(--ac)}#sb .pips i{font-style:normal;color:#445}
#sb .mid{padding:6px 14px;text-align:center;border-left:1px solid var(--line)}#sb .clk{font-size:18px}#sb .dn{font-size:12px;opacity:.8;font-weight:600;white-space:nowrap}
#banner{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 56px));left:50%;transform:translateX(-50%);background:linear-gradient(180deg,rgba(20,32,52,.96),rgba(10,16,28,.96));border:1px solid rgba(255,212,0,.35);padding:12px 24px;border-radius:14px;font-weight:800;z-index:8;display:none;max-width:92vw;text-align:center;font-size:18px;letter-spacing:.4px;box-shadow:0 12px 40px rgba(0,0,0,.5),0 0 24px rgba(255,212,0,.12)}
#pcard{position:fixed;top:max(10px,env(safe-area-inset-top));right:16px;background:var(--pn);border:1px solid var(--line);padding:8px 12px;border-radius:12px;font-size:14px;z-index:5;display:none}#pcard small{opacity:.7;margin-left:4px}
#panel{position:fixed;left:0;right:0;bottom:0;background:linear-gradient(180deg,rgba(12,20,34,.97),rgba(6,10,18,.98));border-top:1px solid rgba(255,212,0,.2);padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:9;display:none;max-height:56vh;overflow:auto;backdrop-filter:blur(10px);box-shadow:0 -12px 40px rgba(0,0,0,.45)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}.pr{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;align-items:center}.tabs .sp{flex:1}.tabs button.on{background:var(--ac);color:#111;font-weight:700;border-color:var(--ac)}.tabs .chip{padding:6px 10px;font-size:13px;border-radius:99px}
.plays{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.play{flex:0 0 auto;width:140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:4px 4px 8px;text-align:center;font-size:13px;font-weight:600;cursor:pointer}.play:hover{border-color:var(--ac)}
.play canvas{border-radius:9px;display:block;margin:0 auto 6px}.sparea{height:116px;display:flex;align-items:center;justify-content:center;font-size:44px}
#hike{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:7;display:none;font-size:20px;padding:14px 46px;border-radius:14px}
#rcv{position:fixed;inset:0;pointer-events:none;z-index:6;display:none}
.rl{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;pointer-events:auto;cursor:pointer;touch-action:none;gap:3px}
.rl i{font-style:normal;font-weight:900;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;letter-spacing:.3px;color:#111;border:2px solid rgba(0,0,0,.35);box-shadow:0 2px 8px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.rl i.btn-a{background:#3ddc84}.rl i.btn-b{background:#ff4d4d}.rl i.btn-x{background:#4aa3ff}.rl i.btn-y{background:#ffd400}
.rl i.btn-rb{background:#2a3038;color:#fff;border-radius:8px;width:40px;font-size:11px;border-color:#8a93a0;box-shadow:0 2px 8px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.15)}
.rl span{font-size:10px;font-weight:700;background:rgba(0,0,0,.65);padding:2px 7px;border-radius:6px;min-height:0;letter-spacing:.2px}.rl span:empty{display:none}
.rl.blk i{opacity:.35;filter:grayscale(.4)}.rl.hold i{transform:scale(1.4);box-shadow:0 0 16px rgba(255,255,255,.9),0 2px 8px rgba(0,0,0,.5)}
#meter{position:fixed;left:50%;bottom:calc(130px + env(safe-area-inset-bottom));transform:translateX(-50%);width:min(220px,56vw);z-index:8;display:none;pointer-events:none;text-align:center}
#meter canvas{width:100%;height:auto;display:block;background:transparent}
#tmmsg{font-size:11px;opacity:.9;font-weight:800;letter-spacing:1px;margin-top:4px;text-shadow:0 1px 4px #000;color:#fff}
#tag{position:fixed;left:50%;bottom:34%;transform:translateX(-50%);font-size:44px;font-weight:900;font-style:italic;letter-spacing:2px;z-index:8;display:none;text-shadow:0 3px 14px rgba(0,0,0,.7);animation:pop 1s ease-out}
@keyframes pop{0%{transform:translateX(-50%) scale(.6);opacity:0}15%{transform:translateX(-50%) scale(1.15);opacity:1}100%{transform:translateX(-50%) scale(1) translateY(-16px);opacity:0}}
#tag.tPERFECT{color:#ffe14d}#tag.tGOOD{color:#8ff08a}#tag.tBULLET{color:#76cbf8}#tag.tTOUCH{color:#c8f0ff}#tag.tLOB{color:#ffe6a0}#tag.tEARLY,#tag.tLATE,#tag.tSHANK{color:#ff7a5a}#tag.tOK{color:#fff}
#celeb{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:9;display:none;flex-wrap:wrap;gap:8px;justify-content:center;max-width:94vw;background:var(--pn);border:1px solid var(--line);border-radius:14px;padding:12px}
#celeb .hd{width:100%;text-align:center;font-weight:800;color:var(--ac)}#celeb button u{text-decoration:none;opacity:.6;margin-right:6px;font-size:12px}
#touch{display:none;pointer-events:none}body.touch #touch{display:block}
#stick{position:fixed;left:calc(16px + env(safe-area-inset-left));bottom:calc(22px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);z-index:7;touch-action:none;pointer-events:auto}
#nub{position:absolute;left:41px;top:41px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,.45)}
.ab{position:fixed;z-index:7;width:62px;height:62px;border-radius:50%;padding:0;font-size:11px;font-weight:800;background:rgba(255,212,0,.22);border:2px solid var(--ac);touch-action:none;display:none;pointer-events:auto}
#touch.offs .ab.o,#touch.defs .ab.d{display:block}
#passBar{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(168px + env(safe-area-inset-bottom));z-index:8;gap:10px;align-items:center;pointer-events:none}
body.touch #passBar.on{display:flex}
#passBar button{pointer-events:auto;width:52px;height:52px;border-radius:50%;border:2px solid rgba(0,0,0,.25);font-weight:900;font-size:13px;color:#111;padding:0;touch-action:none}
#passBar button.a{background:#3ddc84}#passBar button.b{background:#ff4d4d}#passBar button.x{background:#4aa3ff}#passBar button.y{background:#ffd400}#passBar button.rb{background:#2a3038;color:#fff;border-radius:10px;width:58px;font-size:11px}
#passBar button.hold{outline:3px solid #fff;transform:scale(1.08)}
.ab[data-a=run]{right:20px;bottom:22px;width:72px;height:72px}.ab[data-a=dive]{right:100px;bottom:30px}.ab[data-a=juke],.ab[data-a=hit]{right:20px;bottom:104px}.ab[data-a=spin],.ab[data-a=sw]{right:92px;bottom:104px}
.ab[data-a=stiff]{right:164px;bottom:30px}.ab[data-a=hurdle]{right:20px;bottom:176px}.ab[data-a=sw2]{right:92px;bottom:176px}
#menu,#final{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 0%,#1a3a58 0%,#0a1420 42%,#05080e 100%);z-index:20;overflow:auto;padding:16px}
#menu::before,#final::before{content:'';position:fixed;inset:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");pointer-events:none;z-index:0}
#final{display:none;background:rgba(5,8,12,.9);z-index:30}
.card{position:relative;z-index:1;display:flex;flex-direction:column;gap:12px;width:min(500px,100%);text-align:center;max-height:100%;background:linear-gradient(180deg,rgba(18,28,40,.92),rgba(10,16,24,.96));border:1px solid rgba(255,255,255,.08);border-radius:18px;padding:22px 20px 18px;box-shadow:0 20px 60px rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.06)}
.card.wide{width:min(580px,100%)}
.logo{font-size:34px;font-weight:900;letter-spacing:4px;color:var(--fg);line-height:1.05}.logo b{color:var(--ac);margin-left:8px}.sub{margin:0;opacity:.65;font-size:13px;letter-spacing:.4px}.hint{font-size:11px;opacity:.55;line-height:1.55;text-align:left}
h2{margin:0;font-size:28px;color:var(--ac);letter-spacing:1px}.big{font-size:24px;font-weight:800;line-height:1.45}.fs{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;text-align:left;justify-content:center;font-size:14px}
#list{overflow:auto;max-height:34vh;text-align:left;background:rgba(0,0,0,.35);border-radius:12px;padding:4px;border:1px solid rgba(255,255,255,.05)}
.conf{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;opacity:.5;padding:10px 6px 4px;font-weight:700}
.team{display:flex;align-items:center;gap:10px;padding:10px 10px;border-radius:10px;cursor:pointer;transition:background .12s}.team:hover{background:rgba(255,255,255,.04)}.team b{opacity:.55;font-weight:400}.team span{margin-left:auto;font-weight:700;opacity:.85;font-variant-numeric:tabular-nums}
.team i{width:18px;height:18px;border-radius:50%;border:3px solid;display:inline-block;flex-shrink:0}.team .helm{display:inline-block}.team.on{background:rgba(255,212,0,.12);box-shadow:inset 3px 0 0 var(--ac)}
.sel{min-height:22px;font-size:13px;opacity:.9}input,select{font:inherit;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:#0c141e;color:var(--fg);width:100%;box-sizing:border-box}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;font-size:14px;align-items:center}
.mode-tabs{display:flex;gap:6px;background:rgba(0,0,0,.35);padding:4px;border-radius:12px;margin-bottom:4px}

.mode-tabs button.pri{background:var(--ac);color:#111}
.arch-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:12px;cursor:pointer;border:1px solid rgba(255,255,255,.06);background:rgba(0,0,0,.25);margin:4px 0;text-align:left;transition:border-color .12s,background .12s}
.arch-card:hover{border-color:rgba(255,255,255,.15)}.arch-card.on{border-color:var(--ac);background:rgba(255,212,0,.1)}
.arch-card .stars{color:var(--ac);letter-spacing:1px;font-size:13px}
.ctrl-legend{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}

.ctrl-legend .gp.a{background:#3ddc84}.ctrl-legend .gp.b{background:#ff4d4d}.ctrl-legend .gp.x{background:#4aa3ff}.ctrl-legend .gp.y{background:#ffd400}
.ctrl-legend .gp.rb{background:#2a3038;color:#fff;border-radius:7px;width:36px;font-size:10px;border-color:#8a93a0}
button.pri{box-shadow:0 4px 16px rgba(255,212,0,.25)}
.chip{padding:7px 12px;font-size:13px;border-radius:99px}.chip.on{background:var(--ac);color:#111;font-weight:700;border-color:var(--ac)}
#err{position:fixed;left:8px;right:8px;bottom:8px;max-height:30vh;overflow:auto;background:#3a0b0b;color:#ffd0d0;font:12px/1.4 monospace;padding:8px;border-radius:8px;z-index:99;display:none;white-space:pre-wrap;user-select:text}
#scShow{position:fixed;inset:0;z-index:40;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.82);padding:16px}

#scShow .sc-score{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:12px 0;font-size:28px;font-weight:900}

// ---- random look, weighted by position ----
function rollLook(seed,pos,kit){
  const r=mulberry((seed|0)+99),P=p=>r()<p,pick=a=>a[Math.floor(r()*a.length)];

  const big=line||pos==='TE'||pos==='LB';
  const tc=[kit.trim,'#ffffff','#111111',kit.jersey,'#39ff14','#ff6a00'];
  const L={skin:pick(SKINS),hair:pick(HAIRS)};
  L.fit=pick(line?['standard','loose','loose','tight']:pos==='QB'?['tight','tight','standard']:['tight','tight','tight','standard']);
  // jersey length: heavy cropped bias for skill (CFB 27 style)
  L.jerseyLen=pick(skill?['cropped','cropped','cropped','short','short','standard']:line?['standard','long','long']:['cropped','short','standard','standard']);
  L.undershirt=pick(['#f4f4f4','#f4f4f4','#ffffff','#f4f4f4','#ffffff']);
  // shorts / pants length
  L.pants=P(line?.12:(pos==='CB'||pos==='WR'||pos==='S')?.62:.38)?'otk':P(.28)?'knee':'std';
  L.shortsLen=L.pants==='otk'?'long':pick(['short','mid','mid','knee']); // adjustable shorts length
  L.guardian=P(line?.78:(pos==='LB'||pos==='TE')?.52:pos==='RB'?.18:.08)?pick([kit.helmet,'#ffffff','#111111',kit.trim,kit.helmet]):null;
  L.mask=line?'heavy':(pos==='RB'||pos==='LB'||pos==='TE')?'medium':'light';
  L.maskCol=pick(['#e9e9e9','#111111',kit.trim,'#e9e9e9','#c0c0c0']);
  L.visor=(!line&&P(.48))?pick(['clear','smoke','amber','smoke']):null;
  L.helmet=P(.18)?pick(['#ffffff','#111111',kit.trim]):kit.helmet;
  L.armSleeve=P(skill?.88:.48)?pick(['L','R','B','B','B','B']):null; L.armSleeveCol=pick(tc.slice(0,4).concat(['#f4f4f4','#ffffff'])); L.armSleeveLen=pick(['fore','fore','fore','full']); // baggy half-sleeves default CFB 27
  L.legSleeve=P(skill?.42:.12)?pick(['L','R','B']):null; L.legSleeveCol=pick(tc.slice(0,4));
  L.wrist=P(.68)?pick(['L','R','B']):null; L.wristCol=pick(tc);
  // custom gloves: color + style
  L.gloves=P(line?.42:(pos==='QB'||pos==='K'||pos==='P')?.12:.82)?{
    col:pick(['#111111','#ffffff',kit.trim,kit.jersey,'#39ff14','#ff6a00','#c0c0c0','#1a3a6e','#8b0000']),
    style:pick(['receiver','lined','padded','sticky'])

  L.towel=(pos==='QB'||pos==='RB'||pos==='WR')&&P(.48);
  L.neckRoll=(pos==='LB'||pos==='DL'||pos==='TE'||pos==='S')&&P(.55);
  L.turtleneck=P(big?.35:skill?.22:.12)?pick(['#111111','#1a1a1a',kit.trim,'#0d1a2a','#ffffff']):null;
  L.backplate=P(line?.55:big?.28:.08);
  L.shoulderPads=line||P(big?.7:.25);
  L.thighPads=P(line?.6:big?.35:.08);
  L.eyeBlack=P(.42);
  // hair out of helmet: locks / pony / mop / fade-fluff / braids
  L.longHair=P(.38)?pick(['locks','pony','mop','fluff','braids']):null;
  // cleats: more colors + high-top / mid / low + accent stripe
  L.cleat=pick(['#ffffff','#111111',kit.trim,'#39ff14','#ff6a00','#e9e9e9','#ff2d55','#5ac8fa','#bf5af2','#ffd60a','#30d158']);

  L.sock=pick([kit.sock,kit.sock,kit.trim,'#ffffff','#111111']); L.sockStripe=P(.62);
  L.elbowPad=line&&P(.5)||P(.08);

  L.tape=P(.32); L.armBand=P(.22); L.ankleTape=P(.48);
  L.playWrist=pos==='QB';

  L.mouth=pick(['#ff3b7a','#ff2d55','#ff69b4','#39ff14','#ffd400','#2f6bff','#ff6a00','#bf5af2','#00e5ff','#ff1493']);

  if(L.mouthStyle==null)L.mouthStyle='hang';
  L.ribProtector=P(line?.4:big?.22:.05);
  L.handWarmer=(pos==='QB'||pos==='RB')&&P(.28);
  L.chinStrapCol=pick(['#111111','#ffffff',kit.trim,'#e9e9e9']);
  L.helmetSticker=P(.55);
  L.forearmPad=skill&&P(.25);
  L.streamers=P(.08);
  // tattoos: sleeve / half / marks on arm / leg / neck
  L.tattoos=P(skill?.4:big?.28:.18)?{

    ink:pick(['#1a1a2a','#2a1520','#0d1a2a','#1a0a0a'])

// number plate textures (cached)
const _NT={};
function numTex(num,fill,trim,name){
  const k=num+fill+trim+(name||'');if(_NT[k])return _NT[k];
  const c=document.createElement('canvas');c.width=128;c.height=name?160:128;const x=c.getContext('2d');
  x.textAlign='center';x.textBaseline='middle';
  if(name){x.font='bold 24px sans-serif';x.fillStyle=fill;x.fillText(name.toUpperCase(),64,16);}
  x.font='bold 100px "Arial Black",Impact,sans-serif';x.lineWidth=11;x.strokeStyle=trim;x.strokeText(num,64,name?92:66);x.fillStyle=fill;x.fillText(num,64,name?92:66);
  const t=new THREE.CanvasTexture(c);t.anisotropy=4;return _NT[k]=t;
}
function plate(parent,tex,w,h,x,y,z,flip){
  // Numbers sit ON the jersey: small outward offset + polygonOffset so they never z-fight / glitch
  const mat=new THREE.MeshBasicMaterial({map:tex,transparent:true,depthWrite:true,depthTest:true,side:THREE.DoubleSide});
  mat.polygonOffset=true;mat.polygonOffsetFactor=-2;mat.polygonOffsetUnits=-2;
  const m=new THREE.Mesh(gc('p'+w+h,()=>new THREE.PlaneGeometry(w,h)),mat);
  m.position.set(x,y,z);if(flip)m.rotation.y=Math.PI;parent.add(m);return m;
}

// ---- face mask cages ----
function maskGeos(H,type){return gc('mask'+H+type,()=>{
  const out=[],Rx=.092*H,Rz=.108*H,tube=.0075;
  const T=(pts)=>new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),14,tube,4,false);
  const bar=(y,w,sag)=>{const p=[];for(let i=0;i<=10;i++){const a=Math.PI/2-w+2*w*i/10;p.push(new THREE.Vector3(Rx*Math.cos(a)*1.02,y+sag*Math.pow(Math.cos(a),2),Rz*Math.sin(a)))}return T(p)};
  const vert=(x,y0,y1)=>{const p=[];for(let i=0;i<=8;i++){const s=i/8;p.push(new THREE.Vector3(x*(1-.25*s),y0+(y1-y0)*s,Rz*Math.sqrt(Math.max(.1,1-Math.pow(x/Rx,2)))*(1-.2*s*s)+.012*H*s))}return T(p)};
  const top=.03*H,bot=-.1*H;
  if(type==='light'){out.push(bar(.012*H,1.05,-.0),bar(-.045*H,1.0,-.004),bar(-.1*H,.55,-.008),vert(0,top,bot),vert(-.045*H,top,bot),vert(.045*H,top,bot))}
  else if(type==='medium'){out.push(bar(.014*H,1.08,0),bar(-.03*H,1.05,-.004),bar(-.07*H,.85,-.006),bar(-.105*H,.55,-.01),vert(0,top,bot),vert(-.05*H,top,bot),vert(.05*H,top,bot),vert(-.075*H,top,bot+.01),vert(.075*H,top,bot+.01))}
  else out.push(bar(.016*H,1.1,0),bar(-.02*H,1.08,-.003),bar(-.055*H,1.0,-.006),bar(-.09*H,.8,-.009),bar(-.115*H,.5,-.012),vert(0,top,bot),vert(-.04*H,top,bot),vert(.04*H,top,bot),vert(-.075*H,top,bot+.015),vert(.075*H,top,bot+.015));
  return out;});}

const GAITS={run:1,runPower:1,runElusive:1,runLong:1,runChoppy:1,runGlide:1,backpedal:1,rush:1,stiffArm:1,juke:1,scramble:1,highKnee:1,zoneDrop:1};
const TIMED={bow:1.2,diveCatch:.7,kissBicep:.5,throw:.66,throwSidearm:.62,throwQuick:.5,handoffGive:.6,handoffTake:.6,catchHigh:.55,catchMid:.45,catchBody:.5,tackle:.6,diveTackle:.9,fallBack:.8,fallFwd:.7,getUp:1.15,juke:.45,hurdle:.6,kick:.95,punt:.95,plantCut:.4,shovel:.5,tipBall:.45,qbSlide:.7,spin:.5,stiffArm:.55};
// ---- Procedural scenario animation bank (~1000+ variants) ----
(function buildAnimBank(){
  const styles=['std','power','elusive','long','choppy','glide'];
  const leanN=[0.85,1,1.12,1.22], armN=[0.88,1,1.1,1.2], rateN=[0.9,1,1.1,1.2], dirN=[-1,1];
  let n=0;
  const wrap=(base,mod)=>function(t,a){
    const src=CLIPS[base];if(!src)return CLIPS.idle(t,a);
    const pose=src(t,{...a,...mod,style:mod.style||a.style});
    if(mod.leanMul&&pose.lean!=null)pose.lean*=mod.leanMul;
    if(mod.armMul){['sxL','sxR','elL','elR'].forEach(k=>{if(pose[k]!=null)pose[k]*=mod.armMul});}
    if(mod.sideMul&&pose.side!=null)pose.side*=mod.sideMul;
    if(mod.twistMul&&pose.twist!=null)pose.twist*=mod.twistMul;
    if(mod.liftAdd&&pose.lift!=null)pose.lift+=mod.liftAdd;
    if(mod.hxAdd&&pose.hx!=null)pose.hx+=mod.hxAdd;
    return pose;
  };
  // run variants across styles × lean × arm × rate
  for(const st of styles)for(const lm of leanN)for(const am of armN)for(const rt of rateN){
    const id=`run_${st}_L${lm}_A${am}_R${rt}`.replace(/\./g,'p');
    CLIPS[id]=wrap('run',{style:st,leanMul:lm,armMul:am,rate:rt});
    GAITS[id]=1;n++;
  }
  // backpedal / zone / press / rush scenario packs
  for(const base of ['backpedal','zoneDrop','pressJam','rush','scramble','highKnee','passPro','blockEngage','stand2','idle','shotgun','qbUnder','stance3']){
    if(!CLIPS[base])continue;
    for(const lm of leanN)for(const am of armN)for(const d of dirN){
      const id=`${base}_v${n}`;
      CLIPS[id]=wrap(base,{leanMul:lm,armMul:am,sideMul:d,twistMul:d,dir:d});
      if(base==='backpedal'||base==='rush'||base==='scramble'||base==='highKnee')GAITS[id]=1;
      n++;
    }
  }
  // throw / catch / tackle timed packs
  for(const base of ['throw','throwSidearm','throwQuick','catchHigh','catchMid','catchBody','tackle','diveTackle','juke','spin','hurdle','stiffArm','plantCut','shovel','tipBall','qbSlide','handoffGive','handoffTake']){
    if(!CLIPS[base])continue;
    for(let i=0;i<12;i++){
      const id=`${base}_s${i}`;
      CLIPS[id]=wrap(base,{leanMul:0.9+i*0.03,armMul:0.9+(i%5)*0.05,twistMul:(i%2?1:-1)*(0.9+i*0.02),hxAdd:(i%3-1)*0.04,liftAdd:(i%4)*0.01,style:i%3===0?'sidearm':i%3===1?'quick':'over'});
      if(TIMED[base])TIMED[id]=TIMED[base]*(0.92+i*0.01);
      if(GAITS[base])GAITS[id]=1;
      n++;
    }
  }
  // celebration variants
  for(const base of ['spike','flex','pointSky','airplane','shimmy','hype','knees','pointFwd','sackDance','tdSignal','cheer','jumpBump']){
    if(!CLIPS[base])continue;
    for(let i=0;i<10;i++){
      const id=`${base}_c${i}`;
      CLIPS[id]=wrap(base,{leanMul:0.9+i*0.04,armMul:0.9+i*0.05,liftAdd:i*0.008,sideMul:i%2?1:-1});
      n++;
    }
  }
  // scenario index for decide()
  window.__ANIM_COUNT=n;
  window.__animPick=(prefix,seed)=>{
    const keys=Object.keys(CLIPS).filter(k=>k===prefix||k.startsWith(prefix+'_'));
    if(!keys.length)return prefix;
    const r=((seed|0)*2654435761)>>>0;
    return keys[r%keys.length];
  };
})();

class Animator{
  constructor(P){this.P=P;this.J=P.J;this.D=P.D;this.cur=Object.assign({},NEUTRAL,{pyw:0,pyv:1});this.clip='idle';this.t=Math.random()*5;this.a={sp:0};this.ph=Math.random()*6;this.rate=12;this.ball=null;this.two=false;this.done=false}
  play(name,args,rate){const same=name===this.clip;if(same&&!(args&&args.restart)){if(args)Object.assign(this.a,args);return}
    this.clip=name;this.t=0;this.done=false;this.a=Object.assign({sp:0,dur:TIMED[name]||0},args||{});this.rate=rate||(TIMED[name]?26:13)}
  update(dt,sp){
    const a=this.a;if(sp!=null)a.sp=sp;this.t+=dt;a.t=this.t;a.u=a.dur?cl(this.t/a.dur,0,1):0;if(a.dur&&a.u>=1)this.done=true;
    if(GAITS[this.clip])this.ph+=dt*(4.5+1.35*a.sp)*cl(a.sp/.4,.2,1);a.ph=this.ph;
    const fn=CLIPS[this.clip]||CLIPS.idle,tg=Object.assign({},NEUTRAL,fn(this.t,a));
    // ball carry / two-hand overlays
    if(this.ball==='R')Object.assign(tg,{sxR:.55,szR:.02,twR:.5,elR:1.95});
    if(this.ball==='L')Object.assign(tg,{sxL:.55,szL:.02,twL:-.5,elL:1.95});
    if(this.two)Object.assign(tg,{sxL:.95,szL:.12,elL:1.3,sxR:.95,szR:.12,elR:1.3});
    const c=this.cur,k=1-Math.exp(-this.rate*dt);
    for(const key in NEUTRAL){if(key==='py')continue;const v=tg[key];c[key]+=(v-c[key])*k}
    const hasPy=tg.py!=null;c.pyw+=((hasPy?1:0)-c.pyw)*k;if(hasPy)c.pyv+=(tg.py-c.pyv)*Math.min(1,k*1.5);
    this.apply(sp);
  }
  apply(){
    const c=this.cur,J=this.J,D=this.D,ln=c.lean;
    J.body.rotation.set(c.tilt,0,c.roll);J.body.position.y=c.by;
    const f=(h,k,z)=>(D.T*cs(h)+D.S*cs(h-k))*cs(z);
    const auto=Math.max(f(c.hpL,c.knL,c.hzL),f(c.hpR,c.knR,c.hzR))+D.F+c.lift;
    J.pel.position.y=auto*(1-c.pyw)+c.pyv*D.H/2*c.pyw*1;   // manual py is in yards*H/2 units -> convert below
    J.pel.rotation.set(0,c.pelY,c.pelZ);
    J.spine.rotation.set(ln,c.twist,c.side);J.head.rotation.set(c.hx-ln,c.hy,0);
    J.shL.rotation.set(-(c.sxL+ln),0,c.szL);J.twL.rotation.y=c.twL;J.elL.rotation.x=-c.elL;
    J.shR.rotation.set(-(c.sxR+ln),0,-c.szR);J.twR.rotation.y=c.twR;J.elR.rotation.x=-c.elR;
    J.hipL.rotation.set(-c.hpL,0,c.hzL);J.knL.rotation.x=c.knL;J.anL.rotation.x=c.anL;
    J.hipR.rotation.set(-c.hpR,0,-c.hzR);J.knR.rotation.x=c.knR;J.anR.rotation.x=c.anR;
    if(J.hair)J.hair.rotation.x=.1+(this.a.sp||0)*.035+.04*sn(this.t*9);
    if(J.towel)J.towel.rotation.x=-.12-(this.a.sp||0)*.03*sn(this.ph);
  }
}

    if(d.hit>0)form='hitstick';
    else if(d.dive>0)form='dive';
    else if(openField&&(d.r.spd||70)>(c.r.spd||70)-5)form='open';
    else if(sideline)form='sideline';
    else if(goalLine)form='goalline';
    // tackle probability
    const btk=(c.r.btk||70), tck=(d.r.tck||70), trk=(c.r.trk||c.r.str||70);
    let p=0.62+(tck-(btk*0.55+trk*0.25+(c.r.bcv||70)*0.2))/100;
    if(form==='hitstick')p+=0.20; if(form==='dive')p-=0.08; if(form==='open')p-=0.06;
    if(form==='goalline')p+=0.12; if(form==='sideline')p+=0.08;
    if(c.juke>0)p-=0.26*((c.r.juk||c.r.agi||70)/95);
    if(c.spin>0)p-=0.30*((c.r.spn||c.r.agi||70)/95);
    if(c.hurdle>0&&(d.stun>0||d.dive>0||d.hit>0||Math.random()<.5))continue;
    // gang tackle boost
    let near=0;for(const o of S.D){if(o!==d&&o.stun<=0&&dist(o,c)<1.85)near++}
    p+=near*0.18+(c.att>3?0.18:0)+(c.att>5?0.12:0);
    if(Math.random()<clamp(p,0.10,0.97)){
      S.tackler=d;S.tackleDir=Math.atan2(c.vx-d.vx,c.vy-d.vy);S.hit=form==='hitstick';S.tackleForm=form;
      c.dirt=Math.min(1,(c.dirt||0)+.12+(form==='hitstick'?.12:0));d.dirt=Math.min(1,(d.dirt||0)+.1);
      if(c.wear!=null)c.wear=Math.max(0,c.wear-.04-(form==='hitstick'?.03:0));if(d.wear!=null)d.wear=Math.max(0,d.wear-.03);
      bump(d.pl,'tkl');if(near>0)bump(d.pl,'gang');
      const carA=(c.r.car||c.r.btk||70);
      const fumb=0.009*(1.3-carA/140)*(form==='hitstick'?6.5:1)*(c.spin>0?1.4:1)*(near>1?1.3:1);
      if(Math.random()<fumb){stats('ff');return endPlay('fumble',c.x)}
      if(form==='hitstick')H.event('hitstick',{e:d,c});
      return endPlay('tackle',c.x);
    } else {
      // broken tackle — truck / juke residue
      d.stun=form==='hitstick'?1.2:0.9;c.slow=0.78;c.vx*=0.72;c.vy*=0.72;
      if((c.r.trk||70)>80&&Math.random()<.4){d.stun=1.35;c.slow=0.9;H.event('truck',{e:c,d})}
      else H.event('broken',{e:c,d});
      bump(c.pl,'btk');
    }
  }
  if(c.slow<1&&c.juke<=0&&c.spin<=0)c.slow=Math.min(1,c.slow+dt*1.6);
}


// ===== sim_flow.js : play results, penalties, clock, special teams, AI play calling, game flow =====
function firstDownYards(){return G.mode7?15:10}
function nextDown(nb){G.ball=nb;if(G.ball>=G.fd){G.down=1;G.fd=Math.min(100,G.ball+firstDownYards())}else G.down++;G.togo=Math.max(1,Math.round(G.fd-G.ball))}
function firstDownAt(nb){G.ball=nb;G.down=1;G.fd=Math.min(100,nb+firstDownYards());G.togo=Math.max(1,Math.round(G.fd-nb))}
// ---- penalties ----
function rollPenalty(S,kind,yds){
  const o=G.poss,d=opp(o),B=S.ball;
  if(S.type==='pass'&&(kind==='incomplete'||kind==='int')&&Math.random()<.05){const sp=clamp(Math.round(B.tx-10-G.ball),1,40),nb=Math.min(99,G.ball+sp);firstDownAt(nb);return {msg:'FLAG: Defensive pass interference, '+sp+' yards, automatic first down',runClock:false,flag:'dpi'}}
  if(kind==='sack'&&Math.random()<.06){firstDownAt(Math.min(99,G.ball+15));return {msg:'FLAG: Roughing the passer, 15 yards, automatic first down',runClock:false,flag:'rtp'}}
  if((kind==='tackle'||kind==='oob')&&yds>=6&&Math.random()<.05){const nb=Math.max(1,G.ball-10);G.ball=nb;G.togo=Math.max(1,Math.round(G.fd-nb));return {msg:'FLAG: Offensive holding, 10 yards. Replay the down',runClock:false,flag:'hold'}}
  return null;
}
function preSnapFlag(){
  const S=G.play;if(!S||G.autoTest)return false;
  if(Math.random()<.012){const offF=Math.random()<.55;S.ended=true;S.snapped=true;S.dur=0;
    if(offF){G.ball=Math.max(1,G.ball-5);G.togo=Math.round(G.fd-G.ball);G.post={kind:'penalty',msg:'FLAG: False start, offense. 5 yards',runClock:false,t:0,flag:'fs'}}
    else{const nb=Math.min(99,G.ball+5);if(nb>=G.fd)firstDownAt(nb);else{G.ball=nb;G.togo=Math.max(1,Math.round(G.fd-nb))}G.post={kind:'penalty',msg:'FLAG: Offside, defense. 5 yards',runClock:false,t:0,flag:'off'}}
    G.phase='post';H.banner(G.post.msg,2200);H.event('flag',{});return true}
  return false;
}
// ---- end of play ----
function endPlay(kind,x){
  const S=G.play;if(!S||S.ended)return;S.ended=true;S.meter=null;
  const o=G.poss,d=opp(o),st=G.stats[o]=G.stats[o]||{};S.dur=S.t;S.endKind=kind;
  let nb=clamp(Math.round(x-10),-3,101),yds=nb-G.ball,msg='',runClock=true,turnover=false,newBall=0,pts=0;
  const pen=!G.autoTest?rollPenalty(S,kind,yds):null;
  if(pen){G.post={kind:'penalty',msg:pen.msg,runClock:false,t:0,flag:pen.flag,turnover:false};G.phase='post';H.banner(pen.msg,2600);H.event('flag',{});return}
  if(kind==='td'){
    pts=6;runClock=false;
    const ydsGain=100-G.ball;st.yds=(st.yds||0)+ydsGain;st.td=(st.td||0)+1;
    if(S.type==='pass'){st.ptd=(st.ptd||0)+1;st.pyd=(st.pyd||0)+ydsGain} else st.rtd=(st.rtd||0)+1;
    if(S.carrier&&S.carrier.pl)bump(S.carrier.pl,'td');
    if(S.qb&&S.qb.pl&&S.type==='pass')bump(S.qb.pl,'ptd');
    shiftMom(o,12);pulseStadium(1);
    const how=S.afterCatch?'RECEIVING':(S.type==='pass'?'PASSING':'RUSHING');
    msg=how+' TOUCHDOWN — '+G[o].name.toUpperCase()+'!';
  }
  else if(kind==='incomplete'){msg='Incomplete pass';runClock=false;nextDown(G.ball);shiftMom(d,2)}
  else if(kind==='int'){turnover=true;const ret=ri(0,16);newBall=clamp(100-nb+ret,1,99);msg='INTERCEPTED! '+G[d].name+' ball';runClock=false;st.int=(st.int||0)+1}
  else if(kind==='fumble'){if(Math.random()<.55){turnover=true;newBall=clamp(100-nb,1,99);msg='FUMBLE! Recovered by '+G[d].name;runClock=false}else{msg='Fumble, recovered by offense';nextDown(nb)}}
  else{
    if(nb>=100){pts=6;kind='td';S.endKind='td';msg='TOUCHDOWN '+G[o].name.toUpperCase()+'!';runClock=false}
    else if(nb<=0){G.score[d]+=2;msg='SAFETY!';G.pendingKick=o;runClock=false}
    else{msg=kind==='sack'?'SACK! Loss of '+Math.abs(yds)+' yd'+(Math.abs(yds)==1?'':'s'):(yds>=0?'Gain of '+yds+' yd'+(yds==1?'':'s'):'Loss of '+(-yds));
      if(kind==='oob'){runClock=false;msg+=' (out of bounds)'}
      st.yds=(st.yds||0)+yds;if(S.type==='pass'&&kind!=='sack')st.pyd=(st.pyd||0)+yds;nextDown(nb)}}
  if(kind==='int'&&Math.random()<.03){turnover=false;pts=0;G.score[d]+=7;msg='PICK SIX! '+G[d].name;G.pendingKick=d;newBall=0;G.scoreFor=d;S.pickSix=true}
  G.post={kind,turnover,newBall,pts,msg,runClock,t:0,safety:nb<=0&&kind!=='td'};G.phase='post';
  H.banner(msg,kind==='td'?4500:2200);H.event('end',{kind,S});
  if(kind==='td'||pts>=6){pulseStadium(0.9);shiftMom(o,8)}
  else if(kind==='int'){pulseStadium(0.55);shiftMom(d,10);st.int=(st.int||0)+1}
  else if(kind==='sack'){pulseStadium(0.45);shiftMom(d,5);const ds=G.stats[d]=G.stats[d]||{};ds.sk=(ds.sk||0)+1}
  else if(kind==='fumble'){shiftMom(d,8)}
  else if(yds>=15){shiftMom(o,4);pulseStadium(0.25)}
  else if(yds>=8)shiftMom(o,2);
  // school records
  if(yds>=20){
    if(S.type==='run'||(S.mode==='run'&&S.afterCatch))trackRecord('run',yds,(S.carrier&&S.carrier.name)||'');
    else if(S.type==='pass')trackRecord('pass',yds,(S.receiver&&S.receiver.name)||(S.carrier&&S.carrier.name)||'');
  }
  trackRecord('lead');
  // rivalry heat
  if(isRival(G.home,G.away)&&(kind==='td'||kind==='int'||yds>=20))pulseStadium(0.6);

  if(G.autoTest)G.post.t=99;
}
function postWait(){const P=G.post;return P.kind==='td'||(G.play&&G.play.pickSix)?4.6:P.kind==='penalty'?2.4:(G.play&&G.play.tackler?2.5:2.2)}
function afterPlay(){
  const P=G.post||{},S=G.play,o=G.poss,d=opp(o);
  if(!P.kind){G.phase='playcall';return H.playcall()}
  if(!G.ot){const mercy=Math.abs(G.score.home-G.score.away)>=35&&G.q>=3;
    G.clock-=(S?S.dur||0:0)*G.cspeed;G.lastRunoff=0;
    if(P.runClock||mercy){G.lastRunoff=Math.max(0,34-(S?S.dur||0:0)*G.cspeed);G.clock-=G.lastRunoff}}
  G.play=null;G.celeb=null;V.celeb=null;V.celebWait=false;
  if(P.kind==='penalty')return endQuarterOr(prepNext);
  if(P.kind==='td'){G.score[o]+=P.pts;const xp=Math.random()<.93;if(xp)G.score[o]+=1;H.banner(xp?'Extra point is good':'Extra point is NO GOOD',1400);if(G.ot)return otNext();return endQuarterOr(()=>kickoff(d))}
  if(G.scoreFor){const sc=G.scoreFor;G.scoreFor=null;G.pendingKick=null;if(G.ot)return otNext();return endQuarterOr(()=>kickoff(opp(sc)))}
  if(G.pendingKick){const k=G.pendingKick;G.pendingKick=null;if(G.ot)return otNext();return endQuarterOr(()=>kickoff(opp(k)))}
  if(P.turnover){G.poss=d;firstDownAt(P.newBall);if(G.ot)return otNext();return endQuarterOr(prepNext)}
  if(G.down>4){G.poss=d;firstDownAt(clamp(100-G.ball,1,99));H.banner('Turnover on downs',1800);if(G.ot)return otNext()}
  endQuarterOr(prepNext);
}
function endQuarterOr(next){
  if(!G.ot&&G.clock<=0){G.clock=0;
    if(G.q===1||G.q===3){G.q++;G.clock=G.qLen;H.banner('End of quarter',1500);return next()}
    if(G.q===2){G.q=3;G.clock=G.qLen;G.to={home:3,away:3};showSportsCenter(()=>{kickoff(G.openKicker)});return}
    if(G.q===4){if(G.score.home!==G.score.away)return gameOver();return startOT()}}
  next();
}
function showSportsCenter(onDone){
  const el=$('scShow'),body=$('scBody');
  const lead=G.score.home===G.score.away?'locked up':(G.score.home>G.score.away?G.home.name:G.away.name)+' leads';
  const blurbs=[
    `Under the lights at ${G.home.name} — ${lead} at the half. Second half storylines already writing themselves.`,
    `Big swings early. Coaches in both locker rooms are redrawing the board for Q3.`,

  ];
  body.innerHTML=`<div class="sc-tag">Halftime Report · Fictional Network</div>
    <div class="sc-score"><span style="color:${G.away.c1}">${G.away.abbr}</span><b>${G.score.away}</b><span style="opacity:.5">—</span><b>${G.score.home}</b><span style="color:${G.home.c1}">${G.home.abbr}</span></div>
    <div class="sc-blurb">${blurbs[(Math.random()*blurbs.length)|0]}</div>
    <div class="sc-blurb" style="opacity:.7;font-size:12px">${G.home.name} ${G.home.mascot} vs ${G.away.name} ${G.away.mascot} · Weather: ${(G.weather&&G.weather.name)||'Clear Night'}</div>`;
  el.style.display='flex';V.mode='halftime';
  $('scContinue').onclick=()=>{el.style.display='none';V.mode='game';H.banner('Second half',1600);onDone&&onDone()};
}
function prepNext(){
  G.phase='playcall';G.play=null;G.callTab='Pass';G.form=null;G.sitOut=false;
  if(G.autoTest){autoChoose();return}
  if(G.career){autoChoose();return} // coordinators call the plays in career mode
  if(G.user!==G.poss&&G.lastRunoff>0&&G.q%2===0&&G.clock<120&&G.to[G.user]>0&&G.score[G.user]<G.score[opp(G.user)]&&Math.random()<.0){}
  // AI timeout when trailing late
  const ai=opp(G.user);if(G.lastRunoff>0&&G.clock<150&&(G.q===2||G.q===4)&&G.to[ai]>0&&G.score[ai]<=G.score[opp(ai)]&&(G.poss===ai)){useTimeout(ai)}
  H.playcall();
}
function useTimeout(side){if(G.to[side]<=0||!(G.lastRunoff>0))return false;G.to[side]--;G.clock+=G.lastRunoff;G.lastRunoff=0;H.banner('TIMEOUT '+G[side].name+' ('+G.to[side]+' left)',1600);H.event('timeout',{side});return true}
function gameOver(){G.phase='over';H.banner('FINAL: '+G.home.name+' '+G.score.home+', '+G.away.name+' '+G.score.away,999999);H.final();
  // Franchise result tracking
  if(G.franchisePlaying&&G.franchise){
    const F=G.franchise,g=F.schedule.find(x=>x.week===F.week&&!x.result);
    if(g){
      const userHome=G.user==='home';
      const us=userHome?G.score.home:G.score.away,them=userHome?G.score.away:G.score.home;
      const win=us>them;g.result=win?'W':'L';if(win)F.wins++;else F.losses++;F.week++;
      if(win)F.prestige=Math.min(99,F.prestige+2);else F.prestige=Math.max(10,F.prestige-1);
    }
    G.franchisePlaying=false;
  }
}
function startOT(){G.ot=true;G.otRound=1;G.otFirst=Math.random()<.5?'home':'away';G.otPoss=1;G.poss=G.otFirst;otSet();H.banner('OVERTIME',2000);G.phase='post2';G.post2=0}
function otSet(){G.ball=90;G.down=1;G.fd=100;G.togo=Math.max(1,100-90)}
function otNext(){
  if(G.otPoss===1){G.otPoss=2;G.poss=opp(G.otFirst);otSet();G.phase='post2';G.post2=0;H.banner('OT: '+G[G.poss].name+' ball',1800);return}
  if(G.score.home!==G.score.away||G.otRound>=6)return gameOver();
  G.otRound++;G.otPoss=1;G.poss=G.otFirst;otSet();G.phase='post2';G.post2=0;H.banner('OT round '+G.otRound,1800)}

// ================= SPECIAL TEAMS =================
function kickoff(rcv){
  // 7v7: no kickoffs — start at own 25
  if(G.mode7){
    G.poss=rcv;firstDownAt(25);H.banner('7v7 · '+G[rcv].name+' ball at the 25',1600);
    G.phase='post2';G.post2=0;G.play=null;G.special=null;return;
  }
  const k=opp(rcv),K=G.R[k].K[0];
  const userKick=!G.autoTest&&G.user===k;
  G.poss=k;
  G.special={kind:'kickoff',team:k,kicker:K,fx:45,fy:MID,tx:100,ty:MID,t:0,T:3.1,rcv,userRet:(G.user===rcv&&!G.autoTest),tb:false,
    res:()=>{const sp=G.special||{},land=sp.tx||100,tb=!!sp.tb;
      G.poss=rcv;let nb,msg;
      if(tb||land>=112){nb=25;msg='Kickoff, touchback'}
      else{
        const big=Math.random();
        let ret=big<.03?ri(55,95):big<.12?ri(28,48):ri(6,26);
        // better kick power → harder returns
        const pow=sp.power||.8;ret=Math.round(ret*(1.15-pow*.35));
        nb=clamp(Math.round(100-(land-10)+ret*0.35+ri(-2,4)),3,55);
        msg=ret>=50?('Kickoff RETURNED for a huge gain to the '+nb):('Kickoff returned to the '+nb);
      }
      firstDownAt(nb);H.banner(msg+'. '+G[rcv].name+' ball',2000);G.phase='post2';G.post2=0}};
  if(userKick){
    G.phase='kickmeter';G.km={t:0,kind:'kickoff'};G.play=null;H.kickMeter();return;
  }
  // AI kickoff
  const tb=Math.random()<.42,land=tb?ri(112,119):ri(82,108);
  G.special.tx=land;G.special.ty=MID+rnd(-6,6);G.special.tb=tb;
  G.phase='special';G.play=null;if(G.autoTest)G.special.t=99;
}
function doSpecial(kind){
  // 7v7: no kicks / punts — go for it on 4th instead
  if(G.mode7){H.banner('7v7 — no special teams. Going for it.',1400);const off=pickPlay('pass');return beginPlay(off,aiDefCall(),aiForm(off))}
  const o=G.poss,d=opp(o),K=G.R[o].K[0],Pn=G.R[o].P[0];
  const userKick=!G.autoTest&&G.user===o;
  if(kind==='fg'){
    const dd=100-G.ball+17,rangeMax=44+K.r.thp*.22;
    const base=clamp(.97-(dd-30)*.0135+(K.r.tha-75)/280,.02,.99)*(dd>rangeMax+6?.1:1);
    G.special={kind:'fg',team:o,kicker:K,fx:G.ball+10-7,fy:MID,tx:122,ty:MID,t:0,T:1.5,base,dd};
    G.special.res=()=>{const sp=G.special||{},ok=!!sp.ok;
      if(ok){G.score[o]+=3;H.banner('FIELD GOAL IS GOOD! ('+dd+' yd)',1800);G.phase='sp_after';G.afterFn=()=>{if(G.ot)return otNext();kickoff(d)}}
      else{H.banner('FIELD GOAL NO GOOD ('+dd+' yd)',1800);const nb=Math.max(20,100-(G.ball-7));G.poss=d;firstDownAt(Math.min(99,nb));G.phase='sp_after';G.afterFn=()=>{if(G.ot)return otNext();prepNext()}}};
    if(userKick){G.phase='kickmeter';G.km={t:0,kind:'fg'};G.play=null;H.kickMeter();return}
    G.special.ok=Math.random()<base;G.special.tx=G.special.ok?122:112;G.special.ty=MID+(G.special.ok?0:(Math.random()<.5?-5:5));
  } else {
    // PUNT — user gets power/accuracy meter in career + exhibition
    const baseDist=clamp(36+Pn.r.thp*.2,30,62);
    G.special={kind:'punt',team:o,kicker:Pn,fx:G.ball+10-13,fy:MID,tx:10,ty:MID,t:0,T:2.4,baseDist,land:0,dist:baseDist};
    G.special.res=()=>{const sp=G.special||{},land=sp.land||Math.round(G.ball+sp.dist),dist_=sp.dist||baseDist;
      let nb,msg;if(land>=100){nb=20;msg='Punt, touchback'}else{
        const big=Math.random();
        const ret=big<.04?ri(25,55):big<.18?ri(10,22):ri(0,9);
        nb=clamp(100-land+ret,2,99);
        msg='Punt '+Math.round(dist_)+' yds'+(ret?(' , returned '+ret+' to the '+nb):'');
      }
      G.poss=d;firstDownAt(nb);H.banner(msg,1800);G.phase='sp_after';G.afterFn=()=>{if(G.ot)return otNext();prepNext()}};
    G.special.userRet=(G.user===d&&!G.autoTest);
    if(userKick){G.phase='kickmeter';G.km={t:0,kind:'punt'};G.play=null;H.kickMeter();return}
    // AI punt
    const dist_=clamp(baseDist+rnd(-6,6),28,70),land=Math.round(G.ball+dist_);
    G.special.dist=dist_;G.special.land=land;G.special.tx=10+Math.min(land,118);
  }
  G.phase='special';G.play=null;if(G.autoTest)G.special.t=99;
}
function kickPress(){
  // User timing meter for FG / PUNT / KICKOFF — not automatic
  if(G.phase!=='kickmeter'||!G.km)return;
  const sp=G.special;if(!sp){G.phase='playcall';H.playcall();return}
  const cur=Math.sin(G.km.t*3.2),acc=1-Math.abs(cur);
  const kind=G.km.kind||sp.kind||'fg';
  sp.meterAcc=acc;
  if(kind==='fg'){
    sp.ok=Math.random()<clamp(sp.base*(.55+.6*acc),.02,.99)&&acc>.18;
    sp.tx=sp.ok?122:112;sp.ty=MID+(sp.ok?cur*1.5:(cur>=0?1:-1)*(4+Math.random()*2));
  } else if(kind==='punt'){
    // power from how long held + accuracy from center
    const power=clamp(.55+acc*.55,.4,1.15);
    const dist_=clamp(sp.baseDist*power+rnd(-3,3),22,72);
    const land=Math.round(G.ball+dist_);
    sp.dist=dist_;sp.land=land;sp.tx=10+Math.min(land,118);sp.ty=MID+cur*4;
    H.banner('Punt '+Math.round(dist_)+' yds',900);
  } else if(kind==='kickoff'){
    const power=clamp(.5+acc*.6,.35,1.1);
    const tb=acc>.82&&Math.random()<.55;
    const land=tb?ri(112,119):clamp(Math.round(78+power*28+rnd(-4,4)),75,115);
    sp.tx=land;sp.ty=MID+cur*5;sp.tb=tb;sp.power=power;
  }
  H.event('kickMeter',{acc});G.phase='special';G.km=null;
}

// ================= AI CALLS =================
function aiOffCall(){
  const d=G.down,tg=G.togo,b=G.ball,trail=G.score[G.poss]<G.score[opp(G.poss)],lead=!trail;
  const clock=G.clock,q=G.q,twoMin=q===2&&clock<120||q===4&&clock<120,red=b>=80,goal=b>=92;
  if(G.mode7)return pickPlay('pass');
  const kicker=(G.R[G.poss].K&&G.R[G.poss].K[0])||{r:{thp:70}},fgd=100-b+17,fgOK=fgd<=42+kicker.r.thp*.12;

function pickPlay(t){

      else if(p.id==='screen')wt=s>8?1.4:0.7;
      else if(p.id==='slant'||p.id==='hitch')wt=s<7?3.2:1.4;
      else if(p.id==='curl'||p.id==='comeback')wt=s>=6&&s<=12?2.6:1.5;

function aiDefCall(){

function tick(dt){

  else if(G.phase==='kickmeter'){G.km.t+=dt;if(G.km.t>2.6*Math.PI/1.6){kickPress()}}

}

// Horizontal power bar: transparent track, white outline, white fill. Zones: LOB | TOUCH | BULLET
function drawThrowMeter(cv,o){
  o=o||{};const v=Math.max(0,Math.min(1,o.v==null?0:o.v));
  const W=cv.width,H=cv.height,x=cv.getContext('2d');
  x.setTransform(1,0,0,1,0,0);x.clearRect(0,0,W,H);
  const pad=10,barH=18,y=(H-barH)/2-6,barW=W-pad*2,x0=pad,r=9;
  // transparent track with soft shadow
  x.save();x.shadowColor='rgba(0,0,0,.45)';x.shadowBlur=8;
  x.beginPath();
  // rounded rect path
  const rr=(xx,yy,ww,hh,rad)=>{x.moveTo(xx+rad,yy);x.arcTo(xx+ww,yy,xx+ww,yy+hh,rad);x.arcTo(xx+ww,yy+hh,xx,yy+hh,rad);x.arcTo(xx,yy+hh,xx,yy,rad);x.arcTo(xx,yy,xx+ww,yy,rad);x.closePath()};
  rr(x0,y,barW,barH,r);
  x.fillStyle='rgba(0,0,0,.18)';x.fill();
  x.restore();
  // white outline
  x.lineWidth=2.5;x.strokeStyle='rgba(255,255,255,.95)';
  x.beginPath();rr(x0,y,barW,barH,r);x.stroke();
  // zone tick marks (LOB | TOUCH | BULLET)
  const ticks=[0.30,0.68];
  x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;
  for(const t of ticks){const tx=x0+barW*t;x.beginPath();x.moveTo(tx,y+3);x.lineTo(tx,y+barH-3);x.stroke()}
  // white power fill
  if(v>0.01){
    const fw=Math.max(r*2,barW*v);
    x.save();
    x.beginPath();rr(x0,y,barW,barH,r);x.clip();
    x.fillStyle='rgba(255,255,255,.92)';
    x.fillRect(x0,y,fw,barH);
    // soft leading edge glow
    x.shadowColor='rgba(255,255,255,.9)';x.shadowBlur=12;
    x.fillRect(x0+fw-4,y,4,barH);
    x.restore();
  }
  // zone labels under bar
  x.font='bold 11px system-ui,-apple-system,sans-serif';x.textAlign='center';x.textBaseline='top';
  x.fillStyle='rgba(255,255,255,.55)';
  x.fillText('LOB',x0+barW*0.15,y+barH+6);
  x.fillText('TOUCH',x0+barW*0.49,y+barH+6);
  x.fillText('BULLET',x0+barW*0.84,y+barH+6);
  // highlight active zone label
  const zone=v<0.30?'LOB':(v<0.68?'TOUCH':'BULLET');

  x.fillText(zone,x0+barW*zx,y+barH+6);
}

function bindRig(e,teamSide){const rig=e.rig=rigFor(e.pl,teamSide);rig.root.visible=true;rig.yaw=e.face+(V.flip?Math.PI:0);rig.anim.play('idle',{},40);rig.anim.ball=null;rig.anim.two=false;rig.root.rotation.y=rig.yaw}

function stanceFor(e,S){
  if(e.role==='OL')return e===S.center?'center':'stance3';
  if(e.role==='DL')return 'stanceDL';
  if(e.role==='TE')return Math.abs(e.y-MID)<8?'stance3':'stanceWR';
  if(e.role==='QB')return S.gun?'shotgun':'qbUnder';
  if(e.role==='RB')return 'stanceRB';
  if(e.role==='WR')return 'stanceWR';
  if(e.role==='LB')return 'stanceLB';
  if(e.role==='CB')return 'stanceCB';

}
function faceToward(tx,ty,e){return Math.atan2(tx-e.x,ty-e.y)}
function seedOf(e){return (e.pl&&(e.pl.seed||e.pl.num*97))||(e.num||0)*31}

}
function throwClip(e){
  const s=(e.pl&&e.pl.anim&&e.pl.anim.throw)||'over';

}
function catchClip(e,high){

}
function decide(e,S,dt){
  const A=e.rig.anim,sp=Math.hypot(e.vx,e.vy),B=S.ball;A.ball=null;A.two=false;e.vface=null;
  if(S.ended)return postAnim(e,S,A,sp);
  if(!S.snapped){A.play(pickAnim(stanceFor(e,S),e),{hand:'R'});return}
  const isO=e.side==='o',carrier=B.state==='held'&&B.holder===e&&(S.carrier===e||(e===S.qb&&S.type==='pass'));
  const rc=runClip(e);
  if(e.dive>0){A.play(pickAnim('diveTackle',e),{});return}
  if(e.hit>0){A.play(pickAnim('tackle',e),{});return}
  if(e.stun>0&&!e.eng){A.play(pickAnim('stumble',e),{});A.ball=carrier?'R':null;return}
  if(e.spin>0){A.play(pickAnim('spin',e),{});A.ball='R';return}
  if(e.juke>0){A.play(pickAnim('juke',e),{dir:e.moveDir||1,sp});A.ball='R';return}
  if(e.stiffT>0){A.play(pickAnim('stiffArm',e),{sp,side:e.stiffSide>0?'L':'R'});A.ball=e.stiffSide>0?'R':'L';return}
  if(e.hurdle>0){A.play(pickAnim('hurdle',e),{});A.ball='R';return}
  if(e.eng){A.play(e.role==='DL'&&seedOf(e)%2===0?'swim':pickAnim('blockEngage',e),{});return}
  if(isO){
    if(e===S.qb&&S.type==='pass'&&B.state!=='snap'){
      if(S.thrownT!=null&&S.t-S.thrownT<.45){A.play(throwClip(e),{restart:S.t-S.thrownT<dt*1.5});return}
      if(B.state==='held'&&B.holder===e){e.vface=Math.PI/2;if(sp>3.2&&!S.carrier){A.play(pickAnim('scramble',e),{sp});A.ball='R';return}
        if(sp>.8){const back=e.vx<-.3;A.play(back?pickAnim('backpedal',e):rc,{sp});A.two=true;return}
        A.play(pickAnim('passPro',e),{sp});A.two=true;return}
    }
    if(e.role==='QB'&&S.type==='run'){if(S.handing){A.play(pickAnim('handoffGive',e),{});A.two=!S.handed;e.vface=faceToward(S.rb.x,S.rb.y,e)}else A.play(S.handed?pickAnim('idle',e):pickAnim('passPro',e),{sp});A.two=!S.handed;return}
    if(e.role==='RB'&&S.type==='run'&&!S.carrier){if(S.handing){A.play(pickAnim('handoffTake',e),{});return}A.play(sp>.8?rc:pickAnim('idle',e),{sp});return}
    if(B.state==='held'&&B.holder===e){A.ball='R';A.play(sp>.55?rc:pickAnim('idle',e),{sp,ball:1,style:(e.pl&&e.pl.anim&&e.pl.anim.run)||'std'});return}
    if(B.state==='air'&&S.target===e){const left=B.T*(1-B.p);if(left<.4||B.p>.55){A.play(catchClip(e,B.z>1.2||S.userJump!=null),{});return}A.play(rc,{sp});return}
    if(e.role==='OL'||e.blocking){if(S.type==='pass')A.play(pickAnim('passPro',e),{sp});else A.play(sp>2.2?rc:pickAnim('blockEngage',e),{sp});return}
    // route runner plant-cut when changing waypoint
    if(e.cutSlow>0){A.play(pickAnim('plantCut',e),{dir:e.moveDir||1});return}
    A.play(sp>.6?rc:pickAnim('stand2',e),{sp});return
  }
  const a=e.assign||{};
  if(S.carrier&&S.mode==='run'||S.type==='run'&&S.t>.2){A.play(sp>.6?rc:pickAnim('stand2',e),{sp});return}
  if(a.t==='rush'){A.play(sp>2.5?pickAnim('rush',e):rc,{sp});if(sp<=.6)A.play(pickAnim('stand2',e),{});return}
  if(a.t==='man'||a.t==='zone'){
    if(B.state==='air'&&dist(e,{x:B.tx,y:B.ty})<4){A.play(pickAnim('tipBall',e),{});return}
    if(a.t==='man'&&S.t<1.2){A.play(pickAnim('pressJam',e),{});return}
    if(a.t==='zone'){A.play(sp>.5?pickAnim('zoneDrop',e):pickAnim('stand2',e),{sp});return}
  }
  const tx=B.state==='air'?B.tx:S.qb.x,ty=B.state==='air'?B.ty:S.qb.y;e.vface=faceToward(tx,ty,e);
  if(sp>.8){const fx=Math.sin(e.vface),fy=Math.cos(e.vface),dot=(e.vx*fx+e.vy*fy)/sp;A.play(dot<-.2?pickAnim('backpedal',e):rc,{sp})}else A.play(pickAnim('stand2',e),{});
}
function postAnim(e,S,A,sp){
  const pt=V.postT,c=S.carrier||(S.ball.state==='held'?S.ball.holder:null),isTkl=e===S.tackler;
  e.vx*=.9;e.vy*=.9;
  if(S.endKind==='td'&&c&&V.celeb){
    if(e===V.celeb.e){A.play(CELEB_CLIP[V.celeb.kind]||'hype',{});A.ball=V.celeb.kind==='spike'&&pt>.9?null:'R';return}
    if(e.side==='o'&&e.role!=='QB'||e.role==='QB'){const T=V.celeb.e;if(pt>.5&&dist(e,T)>2.4){const dx=T.x-e.x,dy=T.y-e.y,d=Math.hypot(dx,dy);e.vx=dx/d*6;e.vy=dy/d*6;e.face=Math.atan2(dx,dy);A.play('run',{sp:6});return}
      if(pt>.5){A.play(e.ovr%2?'jumpBump':'hype',{});e.vx=e.vy=0;return}}
    A.play('idle',{});return}
  if(S.endKind==='sack'&&(e===S.qb||isTkl)){
    if(e===S.qb){A.play(pt<.15?'idle':'fallFwd',{});return}
    A.play(S.sackDance&&pt>.9?'sackDance':'tackle',{});if(pt>2.1)A.play('getUp',{});return}
  if(c&&e===c&&(S.endKind==='tackle'||S.endKind==='fumble'||S.endKind==='oob')){
    const t=S.tackler;let ahead=true;if(t){const fx=Math.sin(e.face),fy=Math.cos(e.face);ahead=((t.x-e.x)*fx+(t.y-e.y)*fy)>0}
    A.play(S.endKind==='oob'?(pt<.4?'run':'stumble'):(ahead?'fallBack':'fallFwd'),{sp});A.ball=pt<.5?'R':null;if(pt>2.0)A.play('getUp',{});return}
  if(isTkl){A.play(S.hit||e.dive>0?'diveTackle':'tackle',{});if(pt>1.1)A.play('getUp',{});return}
  if(S.endKind==='int'&&S.picker===e){A.play(pt>.5?'hype':'run',{sp:pt>.5?0:4});A.ball='R';return}
  if(e.side==='d'&&S.endKind==='sack'&&pt>.6){A.play('idle',{});return}
  A.play(sp>1.2?'run':(e.side==='o'&&S.type==='pass'?'idle':'stand2'),{sp});
}

// ---------- ball ----------
function holdPoint(e,two){const J=e.rig.J;e.rig.root.updateMatrixWorld(true);
  if(two){J.handL.getWorldPosition(_v);const a=_v.clone();J.handR.getWorldPosition(_v);return a.add(_v).multiplyScalar(.5).add(new THREE.Vector3(0,.04,0))}
  J.handR.getWorldPosition(_v);return _v.clone().add(new THREE.Vector3(0,.05,0))}
function syncBall(S,dt){
  const b=V.ball,B=S.ball;b.visible=true;let tgt=null;
  if(!S.snapped){const w=W3(S.L-.2,MID);tgt=new THREE.Vector3(w[0],.2,w[1]);b.position.copy(tgt);b.rotation.set(0,V.flip?-Math.PI/2:Math.PI/2,0);return}
  if(B.state==='snap'){const w=W3(B.x,B.y);b.position.set(w[0],.25+B.z,w[1]);b.rotation.set(0,V.flip?-Math.PI/2:Math.PI/2,B.p*8);return}
  if(B.state==='held'||(S.ended&&B.state!=='air'&&B.state!=='dead')){
    const h=B.holder||S.carrier;if(!h||!h.rig)return;const two=h.rig.anim.two;tgt=holdPoint(h,two);
    if(S.endKind==='td'&&V.celeb&&V.celeb.kind==='spike'&&V.postT>.9){const w=W3(V.celeb.e.x+1,V.celeb.e.y);tgt=new THREE.Vector3(w[0],.12,w[1])}
    if(S.endKind==='tackle'||S.endKind==='fumble'){}

    const yaw=h.rig.root.rotation.y;b.rotation.set(two?0:.3,yaw+(two?0:.5),two?0:1.2);return}
  if(B.state==='air'){const w=W3(B.x,B.y);const dx=(V.flip?-1:1)*(B.tx-B.fx),dz=(V.flip?-1:1)*(B.ty-B.fy),yaw=Math.atan2(dx,dz),d=Math.hypot(dx,dz)||1,slope=-B.h*Math.PI*Math.cos(Math.PI*B.p)/d;
    const bl=Math.min(1,(S.t-(S.thrownT||0))/.12);let pos=new THREE.Vector3(w[0],B.z+1.4*(1-bl)+.2,w[1]);

}

// ---------- per-frame sync for a live/pre-snap/post play ----------
function syncPlay(dt){
  const S=G.play;V.flip=G.poss==='away';
  if(!S.vinit){S.vinit=true;claim(null,S)}
  if(G.phase==='post'){V.postT+=dt;if(!V.celeb&&S.endKind==='td'&&S.carrier){if(G.user===G.poss&&!V.pickCeleb&&V.postT<1.6&&!G.autoTest)V.celebWait=true;else{V.celebWait=false;startCeleb(S)}}}
  const all=[...S.O,...S.D];
  for(const e of all){
    if(G.phase==='post'){e.x+=e.vx*dt;e.y+=e.vy*dt}
    decide(e,S,dt);
    const r=e.rig,A=r.anim,sp=Math.hypot(e.vx,e.vy);
    const [wx,wz]=W3(e.x,e.y);r.root.position.set(wx,0,wz);
    let tgt=(e.vface!=null?e.vface:e.face)+(V.flip?Math.PI:0);
    // defenders being blocked / engaged face their man
    if(e.eng)tgt=faceToward(e.eng.x,e.eng.y,e)+(V.flip?Math.PI:0);
    let da=wrapA(tgt-r.yaw);r.yaw+=da*Math.min(1,dt*(sp>3?11:7));
    let spinAdd=0;if(e.spin>0)spinAdd=(1-e.spin/.5)*Math.PI*2*(e.spinDir||1);
    r.root.rotation.y=r.yaw+spinAdd;
    A.update(dt,sp);
    r.shadow.visible=A.cur.tilt<.8&&Math.abs(A.cur.tilt)<.8;
    // Dirt / mud builds up visually on pants & jersey
    if(r.J&&r.J.dirtMeshes){const op=Math.min(.85,(e.dirt||0)*.9);for(const m of r.J.dirtMeshes){if(m.material)m.material.opacity=op}}
  }
  syncBall(S,dt);
  // controlled player ring + target marker
  const c=S.ctrl&&S.ctrl.rig?S.ctrl:(G.phase==='presnap'&&G.user===G.poss?S.qb:(G.phase==='presnap'?(S.lb&&S.lb[1])||(S.lb&&S.lb[0])||(S.D&&S.D[0]):null));
  if(c&&c.x!=null&&G.phase!=='post'&&G.phase!=='playcall'){
    const [wx,wz]=W3(c.x,c.y);V.ring.visible=true;V.ring.position.set(wx,.05,wz);
    // ring + star are locked to the screen: top of the art always points away from the camera (forward), no spin, centred under the feet
    const fx=V.camLook.x-V.camera.position.x,fz=V.camLook.z-V.camera.position.z;V.ring.rotation.y=Math.atan2(-fx,-fz);
    const ovr=c.ovr||(c.pl&&c.pl.ovr)||0,stam=RING_DRAIN?c.stam:1,wear=RING_DRAIN?(c.wear==null?1:c.wear):1;
    if(V.ringForce||Math.abs(stam-V.ringStam)>.012||Math.abs(wear-V.ringWear)>.01||V.ringOvr!==ovr){
      V.ringStam=stam;V.ringWear=wear;V.ringOvr=ovr;V.ringForce=0;drawIndicator(V.ringCv,{stam,wear,ovr});V.ringTex.needsUpdate=true}
  }else V.ring.visible=false;
  if(S.ball.state==='air'&&S.target){const [wx,wz]=W3(S.ball.tx,S.ball.ty);V.tgt.visible=true;V.tgt.position.set(wx,.06,wz);const k=1+.15*Math.sin(V.t*14);V.tgt.scale.setScalar(k)}else V.tgt.visible=false;
  V.stad.setLines(10+G.ball,10+G.fd,G.phase==='presnap'||G.phase==='live'||G.phase==='playcall');
}
function startCeleb(S){
  const e=S.carrier,user=G.user===G.poss;const cA=e.pl&&e.pl.career&&e.pl.anim&&e.pl.anim.celeb;const kind=V.pickCeleb||(cA&&CELEB_CLIP[cA]?cA:CELEBS[Math.floor(Math.random()*CELEBS.length)][0]);V.pickCeleb=null;
  V.celeb={e,kind};V.postT=0;SFX.cheer();

// ---------- special teams scene ----------
function initSpecial(s){
  hideAllRigs();V.flip=s.team==='away';const k=s.team,r=opp(k),RK=G.R[k],RR=G.R[r];s.ents=[];
  const pool=R=>[...R.WR,...R.RB,...R.LB,...R.CB,...R.S,...R.TE,...R.DL,...R.OL];
  const add=(pl,side,x,y,role,face)=>{const rig=rigFor(pl,side);rig.root.visible=true;rig.anim.ball=null;rig.anim.two=false;rig.anim.play('stand2',{},40);const e={rig,x,y,vx:0,vy:0,role,side,face:face==null?(side===k?Math.PI/2:-Math.PI/2):face,pl,sp:0};rig.yaw=e.face+(V.flip?Math.PI:0);s.ents.push(e);return e};
  const pk=pool(RK),pr=pool(RR);
  if(s.kind==='kickoff'){
    s.K=add(s.kicker,k,s.fx-5,MID,'K');for(let i=0;i<10;i++)add(pk[i],k,s.fx,5+i*4.3+(i>4?0:0),'cov');
    s.R=add(pr[0],r,Math.min(112,s.tx+1),s.ty,'ret',-Math.PI/2);for(let i=1;i<11;i++)add(pr[i],r,70+(i%3)*8,6+i*4.2,'blk',-Math.PI/2);
    s.t0=.9;s.h=16;

    const L=s.kind==='fg'?s.fx+7:s.fx+13;
    const hold=s.kind==='fg'?add(RK.QB[0],k,s.fx,MID+.3,'hold'):add(s.kicker,k,s.fx,MID,'K');
    if(s.kind==='fg'){s.K=add(s.kicker,k,s.fx-1.7,MID-.9,'K');}else s.K=hold;
    for(let i=0;i<7;i++)add(RK.OL[i],k,L-.8,MID+(i-3)*1.25,'ol');
    for(let i=0;i<9;i++)add(pr[i],r,L+1,MID+(i-4)*1.6,'rush',-Math.PI/2);
    s.t0=s.kind==='fg'?.55:.7;s.h=s.kind==='fg'?6:20;
  }
  s.vinit=true;V.snapCam=true;
}
function syncSpecial(dt){

      else A.play(t>s.t0+.3?'run':'stand2',{sp:t>s.t0+.3?3:0});
    } else {

      else if(e.role==='hold'){A.play(t<.3?'shotgun':'stand2',{})}

      else if(e.role==='rush'){if(t>s.t0-.2){e.x-=-3*dt*0;A.play('rush',{sp:3});e.x+=-0*dt}else A.play('stand2',{})}
    }
    const w=W3(e.x,e.y);e.rig.root.position.set(w[0],0,w[1]);
    let da=wrapA(e.face+(V.flip?Math.PI:0)-e.rig.yaw);e.rig.yaw+=da*Math.min(1,dt*6);e.rig.root.rotation.y=e.rig.yaw;A.update(dt,sp);

  else{if(t<s.t0){const q=Math.min(1,t/Math.max(.2,s.t0-.2));bx=(s.fx+(s.kind==='fg'?7:13))+(s.fx-(s.fx+(s.kind==='fg'?7:13)))*Math.min(1,t/.3);by=MID;bz=.5+Math.sin(Math.PI*Math.min(1,t/.3))*(s.kind==='fg'?0:1)}
    else{const q=Math.min(1,(t-s.t0)/(s.T-s.t0));bx=s.fx+(s.tx-s.fx)*q;by=MID+(s.ty-MID)*q;bz=Math.sin(Math.PI*q)*s.h+.3}}

// ---------- events from the sim ----------
H.event=(n,d)=>{

    case'end':{const k=d.kind;if(k==='td'){SFX.whistle();SFX.cheer()}else if(k==='int'||k==='fumble'){SFX.groan();SFX.whistle()}else SFX.whistle();
      if(k==='tackle'||k==='sack'||k==='fumble'){V.shake=.7;const S=d.S,t=S.tackler||S.carrier,c=S.carrier||S.qb;if(c){const w=W3(c.x,c.y);puff(w[0],w[1],7,1.6);SFX.hit()}}break}
    case'hitstick':case'dive':case'swat':V.shake=.5;SFX.hit();break;
    case'stiffHit':case'broken':V.shake=.35;puff(...W3(d.e.x,d.e.y),4,1);SFX.hit();break;
    case'juke':case'spin':case'hurdle':case'jump':break;
    case'flag':SFX.flag();SFX.whistle();break;case'timeout':SFX.whistle();break;case'kickMeter':break;
  }

function capHardCap(pl,k){

    const b=list.find(x=>x.id===id);
    if(b&&b.cap&&b.cap[k])bonus+=b.cap[k];
  });
  return Math.min(99, base); // visual soft; real raise applied via fx
}
function applyBreakers(pl){
  if(!pl||!pl.r)return;
  const list=capBreakerList(pl.pos);
  (pl.breakers||[]).forEach(id=>{

    if(!b||!b.fx)return;
    Object.keys(b.fx).forEach(k=>{if(pl.r[k]!=null)pl.r[k]=Math.min(99,pl.r[k]+b.fx[k])});
  });

}

function advanceFranchiseSeason(){
  const F=G.franchise;if(!F)return;
  if(F.wins>=(F.schedule.length-2)){F.titles++;F.prestige=Math.min(99,F.prestige+8);H.banner('Conference champions! Title secured.',2200)}
  F.history.push({season:F.season,wins:F.wins,losses:F.losses,titles:F.titles});
  F.season++;F.week=1;F.wins=0;F.losses=0;
  if(F.season>F.maxSeasons){H.banner('Franchise complete. Dynasty over.',2400);G.franchise=null;buildMenu();$('menu').style.display='flex';return}
  const team=TEAMS[F.teamId];
  const conf=TEAMS.filter(tm=>tm.conf===team.conf&&tm.id!==team.id);
  F.schedule=conf.slice(0,8).map((tm,i)=>({week:i+1,oppId:tm.id,home:i%2===0,result:null}));
  genProspects(F); // new recruiting class each season
  showFranchiseHub();
}

function isRival(a,b){

  const A=(a.abbr||'').toUpperCase(),B=(b.abbr||'').toUpperCase();

function spCost(rating){return rating>=90?5:rating>=80?3:rating>=70?2:1}
function playCareerWeek(){
  const C=G.career,me=TEAMS[C.teamId];let opp=null;
  for(let i=0;i<50;i++){const t=TEAMS[(Math.random()*TEAMS.length)|0];if(t.id!==me.id&&(!opp||Math.abs(t.ovr-me.ovr)<12))opp=t}
  if(!opp)opp=TEAMS.find(t=>t.id!==me.id)||TEAMS[0];
  $('final').className='';$('final').style.display='none';$('banner').style.display='none';auInit();

  const R=rosterFor(me);
  const list=R[C.pos]||R.WR;let idx=list.findIndex(p=>p===C.player||(p.career&&p.name===C.player.name));
  if(idx<0){list.unshift(C.player);idx=0}else if(idx>0){list.splice(idx,1);list.unshift(C.player)}
  C.player.career=true;
  startGame(me.id,opp.id,'home',UI.qMin||5);G.mode7=false;G.sbStyle=UI.sbStyle||'sb-cfb';
  setupGame();V.mode='game';V.hid=false;$('hud').style.display='block';applyScorebugStyle();

function enterOffseason(){
  const C=G.career;C.phase='offseason';
  const title=C.wins>=9;if(title){C.stats.titles=(C.stats.titles||0)+1;C.prestige=Math.min(99,C.prestige+5)}
  C.history.push({year:C.year,w:C.wins,l:C.losses,title,ovr:C.player.ovr});
  const planBonus={balanced:1,skills:1.4,strength:1.2,film:1.3}[C.practicePlan]||1;
  const bonus=Math.round((30+C.wins*8+C.practiceReps*0.5+C.leadership*0.2)*planBonus);
  C.spBank+=bonus;
  C.stats.careerYds=(C.stats.careerYds||0)+(C.stats.yds||0);
  C.stats.careerTd=(C.stats.careerTd||0)+(C.stats.td||0);
  for(const k in C.recruit)C.recruit[k]=Math.min(100,C.recruit[k]+Math.round(C.wins*2+C.leadership*0.15));
  // commit top interest school — or JUCO if offers aren't there
  const ranked=Object.entries(C.recruit).sort((a,b)=>b[1]-a[1]);
  const top=ranked[0];
  if(top&&top[1]>=85){
    pushText(C,top[0],`Official: we're offering you a full ride. Welcome to ${top[0]}.`);
    C.prestige=Math.min(99,C.prestige+3);C.commit=top[0];C.juco=false;
  } else if(top&&top[1]>=60){
    pushText(C,top[0],`Preferred walk-on invite. Prove it in camp.`);
    C.commit=top[0]+' (PWO)';C.juco=false;
  } else {
    const juco=['Valley JC','Riverbend JC','Metro Community','Prairie JUCO','Bay Tech JC'][(Math.random()*5)|0];
    C.juco=true;C.commit=juco;
    pushText(C,juco,`The offers didn't land where you wanted. ${juco} has a roster spot — film, grow, re-enter the cycle.`);
    pushText(C,'Coach','JUCO path is real. Dominate there and the D1 boards reopen.');
    C.prestige=Math.max(15,C.prestige-4);
    C.spBank+=15; // extra development year energy
  }
  pushText(C,'Coach',`Film is in. +${bonus} SP. Offseason work starts now.`);
  H.banner(C.juco?`Offseason · JUCO path · ${C.commit}`:`Offseason · +${bonus} SP · Year ${C.year}`,3200);
  // Signing-window interview: roster path + NIL, in or out
  runInterview('sign',()=>showCareerHub(false));
}
function runOffseason(){
  const C=G.career;
  if(C.year>=C.maxYears){C.retired=true;H.banner('80-year franchise complete. Legend status.',4000);showCareerHub(false);return}
  C.year++;C.season++;C.week=1;C.wins=0;C.losses=0;C.phase='season';C.agenda=5;C.storyIdx=0;
  C.stats.yds=0;C.stats.td=0;C.stats.tackles=0;C.practiceReps=0;
  C.standings.forEach(t=>{t.w=0;t.l=0});
  // player aging within HS, then new recruit generation every 4 years
  C.player.grade=Math.min(12,C.player.grade+1);
  if(C.player.grade>12){
    const rng=mulberry(C.year*997+C.teamId);
    const np=makePlayer(rng,C.pos,TEAMS[C.teamId].ovr+({5:8,4:3,3:0}[C.arch]||0),new Set(),C.teamId,C.year);
    np.name=pickName();np.career=true;np.stars=C.arch;np.anim=rollAnimStyle(np.seed,C.pos);
    C.player=np;C.spSpent=0;C.spTarget=Math.round(900+(99-np.ovr)*14);C.spBank=Math.round(50+C.arch*12);
    // inject into live roster cache
    const R=rosterFor(TEAMS[C.teamId]);const list=R[C.pos]||R.WR;
    list.forEach(p=>{if(p.career)p.career=false});list.unshift(np);
    pushText(C,'Program',`New cycle: ${np.name} inherits the program. Franchise year ${C.year}.`);
  } else {
    C.player.yr=YEARS[Math.min(3,C.player.grade-9)];
    for(const k of KEYS)if(Math.random()<.35)C.player.r[k]=Math.min(99,C.player.r[k]+1);
    recomputeOVR(C.player);
  }
  seedRecruits(C);
  C.prestige=Math.max(20,C.prestige+(Math.random()-.45)*4|0);
  H.banner(`Year ${C.year}/${C.maxYears} · ${C.player.name} · OVR ${C.player.ovr}`,2800);
  showCareerHub(false);
}

function updateHud(){

}
function pulseStadium(amp){
  if(!V.stad)return;
  const homeMom=(G.momentum&&G.momentum.home)||50;
  const boost=0.7+homeMom/200; // louder when home has momentum
  V.stad.pulseAmp=Math.max(V.stad.pulseAmp||0,(amp||0.35)*boost);
  // subtle crowd material intensity if available
  if(V.stad.crowdN||V.stad.crowdF){const c=Math.min(1,0.4+(amp||0.3));try{
    if(V.stad.crowdN&&V.stad.crowdN.material)V.stad.crowdN.material.opacity=0.85+c*0.15;
  }catch(e){}}
}
function updateStadiumPulse(dt){
  const S=V.stad;if(!S||!S.floods)return;
  S.pulse=(S.pulse||0)+dt;
  S.pulseAmp=Math.max(0,(S.pulseAmp||0)-dt*0.25);
  const base=1.15,w=0.04*Math.sin(S.pulse*2.2)+S.pulseAmp*0.55*Math.abs(Math.sin(S.pulse*9));
  for(const pl of S.floods)pl.intensity=base+w;
}

function playArt(play,formId,isDef){
  const W=132,Hh=116,[c,x]=artCanvas(W,Hh),sx=2.5,sy=3.2,LY=76,P=(px,py)=>[W/2+(py-MID)*sx,LY-px*sy];
  x.fillStyle='#0d2a16';x.fillRect(0,0,W,Hh);x.strokeStyle='rgba(255,255,255,.35)';x.lineWidth=1.5;x.beginPath();x.moveTo(0,LY);x.lineTo(W,LY);x.stroke();

    // defence faces the line: flip so the line is at top and the secondary is below?  keep the same orientation as offence art
    for(const z of (ZN[id]||[])){const p=P(z[0]*.8,z[1]);x.fillStyle='rgba(255,212,0,.16)';x.strokeStyle='rgba(255,212,0,.5)';x.beginPath();x.arc(p[0],p[1],Math.min(z[2],8)*sx*.9,0,7);x.fill();x.stroke()}
    for(let i=0;i<4;i++)dot(P(1.4,MID+(i-1.5)*3),'#ff6b5a');
    for(let i=0;i<3;i++)dot(P(id==='blitz'?3:4.2,MID+(i-1)*6),'#ff6b5a');
    dot(P(man?2:6.5,6.5),'#ff6b5a');dot(P(man?2:6.5,47),'#ff6b5a');dot(P(11,MID-9),'#ff6b5a');dot(P(11,MID+9),'#ff6b5a');
    if(id==='blitz'){arrow(x,[P(3,MID-6),P(-4,MID-1)],'#ffd400',2);arrow(x,[P(3,MID),P(-4,MID)],'#ffd400',2)}
    if(man){for(const y of [6.5,47])arrow(x,[P(2,y),P(9,y)],'rgba(255,255,255,.55)',1.5)}

  const F=FORMS.find(f=>f.id===formId)||FORMS[2],fp=F.p(0);
  for(let i=0;i<5;i++){const p=P(-.8,MID+(i-2)*1.8);x.fillStyle='#e8e8e8';x.fillRect(p[0]-3,p[1]-3,6,6)}

  const start={WR1:fp.wr1,WR2:fp.wr2,WR3:fp.wr3,TE:fp.te,RB:fp.rb};
  for(const k in start)dot(P(start[k][0],start[k][1]),k==='RB'?'#7fd0ff':'#fff');
  if(play.type==='pass'){
    const pri=play.primary||null;
    // draw non-primary first, primary last (on top) in red
    const keys=Object.keys(play.routes||{}).sort((a,b)=>(a===pri?1:0)-(b===pri?1:0));

      const R=ROUTES[play.routes[k]],s=start[k];if(!R||!R.w.length)continue;

      for(const [dx,dy] of R.w)pts.push(P(s[0]+dx,clamp(s[1]+out*dy,2,FW-2)));
      for(const q of pts)q[1]=Math.max(3,q[1]);
      const isPri=k===pri;
      arrow(x,pts,isPri?'#ff2d2d':(k==='RB'?'#7fd0ff':'#ffd400'),isPri?3:2);
      if(isPri){ // primary label
        const tip=pts[pts.length-1];x.fillStyle='#ff2d2d';x.font='bold 9px sans-serif';x.textAlign='center';x.fillText('PRI',tip[0],tip[1]-6);
      }

    const mid=P(s[0]+3,s[1]+(hy-s[1])*0.35),end=P(9,hy);

    // secondary cut

    if(play.qbRun)arrow(x,[P(fp.qb[0],fp.qb[1]),P(6,MID+(play.hole||0)*0.3)],'#7fd0ff',2);
  }

}

    :`Too many negative plays early. You can't dig that hole on Friday.`;
  const q3=G.career
    ?`${player}, talk about your night and the depth chart.`
    :`Message to the town after this one?`;
  const a3=G.career
    ?(won?`I did my job. The job is still to get better by Monday.`:`I own my snaps. We'll clean it up.`)
    :(won?`This community shows up every week. We owed them that effort.`:`We'll be back. Same lights, better details.`);
  IV.kind='press';IV.onDone=onDone;IV.step=0;IV.t=0;
  IV.script=[
    {who:'Press Room · Mic 1',line:`Postgame, ${me.name} ${me.mascot} vs ${them.name}. Final ${G.score.away}–${G.score.home} (${G.away.abbr}–${G.home.abbr}).`},
    {who:coach,line:tone},
    {who:'Reporter · Dana Crowe',line:q2},
    {who:coach,line:a2},
    {who:'Reporter · Maya Ruiz',line:q3},
    {who:player,line:a3},
    {who:'Decision',line:'How do you close the presser?',choices:[
      {label:'We go again Monday',v:'grind'},
      {label:won?'Enjoy the win':'Hold the standard',v:'edge'}
    ]}
  ];
  $('interview').style.display='flex';V.mode='interview';
  if(G.career)setupCutscene3D('press');
  else if(G.home){ // exhibition: show two roster stars
    hideAllRigs();
    const pl=G.R[G.user].QB[0]||G.R[G.user].WR[0];
    if(pl){const rig=rigFor(pl,G.user);rig.root.visible=true;const w=W3(60,MID-6);rig.root.position.set(w[0],0,w[1]);IV.rig=rig;V.camLook.set(w[0],1.5,w[1]);V.camera.position.set(w[0]-8,3.2,w[1]+10)}
  }
  ivShowStep();
}

// ---------- input: keyboard + mouse + gamepad with auto layout ----------
const INPUT={mode:'auto',gpIndex:null,gpPrev:{},gpHold:{},mouse:false,keys:false,lastGp:0};
const GP_PASS={0:0,1:1,2:2,3:3,5:4}; // A B X Y RB → receivers 1-5
const ACT={KeyJ:'juke',KeyK:'spin',KeyL:'stiff',KeyE:['hurdle','sw'],KeyF:'hit',Space:'dive'};
function fireAct(a){if(Array.isArray(a)){for(const k of a)A[k]=1}else A[a]=1}
function isTouchDevice(){
  return ('ontouchstart' in window)||(navigator.maxTouchPoints>0)||matchMedia('(pointer:coarse)').matches;
}
function isTouchPreferred(){
  if(Q.forceTouch)return true;
  if(INPUT.gpIndex!=null)return false;
  if(isTouchDevice())return true;
  if(INPUT.keys||INPUT.mouse)return false;
  return matchMedia('(hover:none)').matches;
}
function applyInputLayout(){
  const touch=isTouchPreferred();
  document.body.classList.toggle('touch',touch);
  document.body.classList.toggle('desk',!touch);
  document.body.classList.toggle('gamepad',INPUT.gpIndex!=null);
  const t=$('touch');
  if(t)t.style.display=touch?'block':'none';
  if(!touch){const bar=$('passBar');if(bar)bar.classList.remove('on')}
}
function detectGamepad(){
  const pads=navigator.getGamepads?navigator.getGamepads():[];
  let found=null;
  for(let i=0;i<pads.length;i++){if(pads[i]&&pads[i].connected){found=i;break}}
  if(found!==INPUT.gpIndex){INPUT.gpIndex=found;applyInputLayout()}
  return found;
}
function pollGamepad(dt){
  detectGamepad();
  if(INPUT.gpIndex==null||V.mode!=='game')return;
  const gp=navigator.getGamepads()[INPUT.gpIndex];if(!gp)return;
  const prev=INPUT.gpPrev,hold=INPUT.gpHold;
  const pressed=(i)=>!!(gp.buttons[i]&&(gp.buttons[i].pressed||gp.buttons[i].value>.45));
  const edge=(i)=>pressed(i)&&!prev[i];
  // left stick movement (deadzone)
  const ax=gp.axes[0]||0,ay=gp.axes[1]||0,dead=.18;
  if(Math.hypot(ax,ay)>dead){TCH.x=ax;TCH.y=-ay;INPUT.lastGp=performance.now()}
  else if(performance.now()-INPUT.lastGp<120){TCH.x*=0.5;TCH.y*=0.5;if(Math.hypot(TCH.x,TCH.y)<.05){TCH.x=0;TCH.y=0}}
  // sprint = RT or LB
  if(pressed(7)||pressed(4)){A.sprint=true;INPUT.lastGp=performance.now()}
  // face buttons + RB = pass targets (hold to power, release to throw)
  for(const [btn,rec] of Object.entries(GP_PASS)){
    const i=+btn;
    if(edge(i)){auInit();pressRec(rec);hold[i]=true;INPUT.lastGp=performance.now()}
    if(!pressed(i)&&hold[i]){hold[i]=false;if(UI.hold===rec)releaseRec()}
  }
  // actions
  if(edge(6)){A.sw2=1} // LT switch player
  if(edge(10)||edge(11))fireAct('juke'); // stick clicks
  if(edge(12))fireAct('juke'); // dpad up
  if(edge(13))fireAct('dive'); // dpad down
  if(edge(14))fireAct('spin'); // dpad left
  if(edge(15))fireAct('stiff'); // dpad right
  if(edge(9)){ // start / options
    if(G.phase==='presnap'&&G.user===G.poss)doHike();
    else if(G.phase==='kickmeter')kickPress();
    else if(G.phase==='playcall')useTimeout(G.user)&&renderPlaycall();
  }
  // store button state
  for(let i=0;i<16;i++)prev[i]=pressed(i);
}
H.stick=()=>{
  let sx=(K.KeyD||K.ArrowRight?1:0)-(K.KeyA||K.ArrowLeft?1:0)+TCH.x;
  let sy=(K.KeyW||K.ArrowUp?1:0)-(K.KeyS||K.ArrowDown?1:0)+TCH.y;
  const m=Math.hypot(sx,sy);if(m<.001||!V.camera)return {x:0,y:0};if(m>1){sx/=m;sy/=m}return stickToSim(sx,sy)};
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.target.tagName==='SELECT')return;
  INPUT.keys=true;applyInputLayout();
  if(V.mode!=='game')return;
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();
  if(e.repeat)return;K[e.code]=true;auInit();
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')A.sprint=true;
  if(G.phase==='kickmeter'&&(e.code==='Space'||e.code==='Enter')){kickPress();return}
  if(V.celebWait&&/^Digit[1-8]$/.test(e.code)){pickCeleb(CELEBS[+e.code.slice(5)-1][0]);return}
  if((e.code==='Enter'||e.code==='KeyH')&&G.phase==='presnap'&&G.user===G.poss){doHike();return}
  if(e.code==='KeyT'&&G.phase==='playcall'){useTimeout(G.user)&&renderPlaycall();return}
  // Pass: 1-5 or QWER / ABXY-style keyboard aliases
  if(/^Digit[1-5]$/.test(e.code))pressRec(+e.code.slice(5)-1);
  if(e.code==='KeyZ')pressRec(0); // A
  if(e.code==='KeyX')pressRec(1); // B
  if(e.code==='KeyC')pressRec(2); // X
  if(e.code==='KeyV')pressRec(3); // Y
  if(e.code==='KeyB')pressRec(4); // RB
  if(e.code==='KeyQ')A.sw2=1;
  if(ACT[e.code])fireAct(ACT[e.code]);
});
addEventListener('keyup',e=>{
  K[e.code]=false;
  if(e.code==='ShiftLeft'||e.code==='ShiftRight')A.sprint=false;
  if(/^Digit[1-5]$/.test(e.code)&&UI.hold===+e.code.slice(5)-1)releaseRec();
  if(e.code==='KeyZ'&&UI.hold===0)releaseRec();
  if(e.code==='KeyX'&&UI.hold===1)releaseRec();
  if(e.code==='KeyC'&&UI.hold===2)releaseRec();
  if(e.code==='KeyV'&&UI.hold===3)releaseRec();
  if(e.code==='KeyB'&&UI.hold===4)releaseRec();
});
addEventListener('mousedown',e=>{
  // don't treat pure touch-emulated clicks as desktop mouse
  if(e.sourceCapabilities&&e.sourceCapabilities.firesTouchEvents)return;
  if(isTouchDevice())return;
  INPUT.mouse=true;applyInputLayout();
});
// force touch HUD on load for phones
addEventListener('DOMContentLoaded',()=>applyInputLayout());
applyInputLayout();
addEventListener('gamepadconnected',e=>{INPUT.gpIndex=e.gamepad.index;applyInputLayout();auInit()});
addEventListener('gamepaddisconnected',()=>{INPUT.gpIndex=null;detectGamepad();applyInputLayout()});
function initTouch(){
  const st=$('stick'),nub=$('nub');let id=null,ox=0,oy=0;
  st.addEventListener('pointerdown',e=>{id=e.pointerId;st.setPointerCapture(id);const r=st.getBoundingClientRect();ox=r.left+r.width/2;oy=r.top+r.height/2;mv(e)});
  const mv=e=>{if(e.pointerId!==id)return;let dx=(e.clientX-ox)/55,dy=(e.clientY-oy)/55;const m=Math.hypot(dx,dy);if(m>1){dx/=m;dy/=m}TCH.x=dx;TCH.y=-dy;nub.style.transform=`translate(${dx*40}px,${dy*40}px)`};
  st.addEventListener('pointermove',mv);const up=e=>{if(e.pointerId!==id)return;id=null;TCH.x=TCH.y=0;nub.style.transform=''};st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);
  for(const b of document.querySelectorAll('#touch .ab')){const a=b.dataset.a;
    b.addEventListener('pointerdown',e=>{e.preventDefault();auInit();if(a==='run')A.sprint=true;else if(a==='sw2')A.sw2=1;else if(a==='kick'){if(G.phase==='kickmeter')kickPress()}else{A.dive=a==='dive'?1:A.dive;if(a==='dive'&&G.phase==='kickmeter')kickPress();else if(a!=='dive')fireAct(a==='hurdle'?['hurdle','sw']:a)}});
    b.addEventListener('pointerup',()=>{if(a==='run')A.sprint=false});b.addEventListener('pointercancel',()=>{if(a==='run')A.sprint=false})}
  $('rcv').addEventListener('contextmenu',e=>e.preventDefault());
  applyInputLayout();
}
// per-frame UI work
function uiFrame(dt){
  try{
    pollGamepad(dt);updateHud();updateLabels();updateMeter();updateCard();updateCeleb();updateWeather(dt);updateStadiumPulse(dt);
    if(G.phase!=='live'){A.dive=A.hit=A.sw=A.juke=A.spin=A.stiff=A.hurdle=A.sw2=0}
    if(UI.snapAt&&performance.now()>UI.snapAt&&G.phase==='presnap'&&G.play&&!G.play.snapped){UI.snapAt=0;snap()}
    const t=$('touch');if(t){const off=G.user===G.poss;t.classList.toggle('offs',off);t.classList.toggle('defs',!off)}
  }catch(err){/* keep frame alive */}
}


// ===== main.js : boot + render loop =====
(function(){
  const err=$('err');let n=0;const show=m=>{if(n++>4)return;err.style.display='block';err.textContent+=m+'\n'};
  addEventListener('error',e=>show((e.message||'error')+' @'+(e.filename||'').split('/').pop()+':'+e.lineno+(e.error&&e.error.stack?' | '+e.error.stack.split('\n').slice(0,4).join(' / '):'')));
  addEventListener('unhandledrejection',e=>show('promise: '+(e.reason&&e.reason.message||e.reason)));
  if(!window.THREE){show('three.js failed to load (network blocked?)');return}
  try{initView($("cv"));buildMenu();buildLabels();initTouch();try{menuHero()}catch(e){}}catch(e){show("init: "+(e&&e.stack?e.stack.split("\n").slice(0,5).join(" / "):e));throw e}
  addEventListener('resize',resizeView);
  // landscape first: ask for it on the first touch (works where the browser allows)
  addEventListener('pointerdown',function f(){removeEventListener('pointerdown',f);if(!matchMedia('(pointer:coarse)').matches)return;try{const el=document.documentElement;(el.requestFullscreen?el.requestFullscreen():Promise.resolve()).catch(()=>{}).then(()=>{try{return screen.orientation&&screen.orientation.lock&&screen.orientation.lock('landscape')}catch(e){}}).catch(()=>{})}catch(e){}},{once:true});
  let last=0,acc=0;
  function frame(ts){
    requestAnimationFrame(frame);
    try{frame2(ts)}catch(e){show('frame: '+(e&&e.stack?e.stack.split('\n').slice(0,5).join(' / '):e));if(!frame.f){frame.f=1;try{for(const k in _RM)if(_RM[k]&&_RM[k].envMap){_RM[k].envMap=null;_RM[k].needsUpdate=true}}catch(_){}}}
  }
  function frame2(ts){
    const dt=Math.min(.05,Math.max(0,(ts-last)/1000));last=ts;
    // interview cutscenes still render 3D models
    if(V.mode==='interview'){
      V.t+=dt;
      if(IV.rig){if(IV.rig.anim)IV.rig.anim.update(dt,0);IV.rig.root.rotation.y=0.35+Math.sin(V.t*1.2)*0.04}
      if(IV.r2){if(IV.r2.anim)IV.r2.anim.update(dt,0);IV.r2.root.rotation.y=-0.35+Math.sin(V.t*1.1+1)*0.03}
      if(V.camera&&V.camLook){
        const ang=V.t*0.15;const cx=V.camLook.x,cz=V.camLook.z;
        V.camera.position.lerp(new THREE.Vector3(cx-7+Math.sin(ang)*1.5,3.0,cz+9+Math.cos(ang)*1.2),1-Math.exp(-2*dt));
        V.camera.lookAt(V.camLook);
      }
      V.renderer.render(V.scene,V.camera);return;
    }
    if(V.mode==='cap'){capFrame(dt);return}
    if(V.mode!=='game'||!G.home)return;
    V.t+=dt;acc+=dt*(G.sitOut?5:1);let k=0;while(acc>=1/60&&k++<(G.sitOut?30:6)){tick(1/60);acc-=1/60}if(k>=(G.sitOut?30:6))acc=0;
    const ph=G.phase;
    if(G.play&&(ph==='presnap'||ph==='live'||ph==='post')){V.hid=false;syncPlay(dt)}
    else if((ph==='special'||ph==='kickmeter')&&G.special){V.hid=false;syncSpecial(dt)}
    else if(ph==='playcall'&&!V.hid){V.hid=true;hideAllRigs();V.ball.visible=false;V.ring.visible=false;V.tgt.visible=false;V.stad.setLines(0,0,false)}
    updateCamera(dt);updatePuffs(dt);uiFrame(dt);
    V.renderer.render(V.scene,V.camera);
  }
  requestAnimationFrame(frame);
  window.__dbg={V,G,UI};
})();
